<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#020C1B"/>
    </linearGradient>
    <filter id="navyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="550" fill="url(#navyBg)"/>
  
  <!-- Blueprint Grid -->
  <g stroke="#172A45" stroke-width="1">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800M0 450h800M0 500h800"/>
    <path d="M50 0v550M100 0v550M150 0v550M200 0v550M250 0v550M300 0v550M350 0v550M400 0v550M450 0v550M500 0v550M550 0v550M600 0v550M650 0v550M700 0v550M750 0v550"/>
  </g>

  <!-- Blueprint Dimension Lines -->
  <g stroke="#64FFDA" stroke-width="1" stroke-dasharray="4,4" fill="none" opacity="0.6">
    <circle cx="400" cy="275" r="180"/>
    <rect x="180" y="120" width="440" height="310"/>
    <line x1="180" y1="120" x2="620" y2="430"/>
    <line x1="620" y1="120" x2="180" y2="430"/>
  </g>

  <!-- Parent Studio Blueprint Card -->
  <g filter="url(#navyShadow)" transform="translate(160, 110)">
    <rect x="0" y="0" width="480" height="320" rx="8" fill="#0A192F" stroke="#64FFDA" stroke-width="2"/>
    
    <text x="40" y="65" fill="#64FFDA" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="3">PARENT STUDIO BLUEPRINT</text>
    <text x="40" y="110" fill="#CCD6F6" font-family="serif" font-size="36" font-weight="bold">JSN CREATIVE.</text>
    <text x="40" y="140" fill="#8892B0" font-family="sans-serif" font-size="14">Navy, Cobalt &amp; Copper Blueprint Identity System</text>
    
    <!-- Color Swatches -->
    <rect x="40" y="180" width="70" height="70" rx="4" fill="#0A192F" stroke="#64FFDA" stroke-width="1.5"/>
    <text x="75" y="220" text-anchor="middle" fill="#64FFDA" font-family="monospace" font-size="10">NAVY</text>
    
    <rect x="130" y="180" width="70" height="70" rx="4" fill="#005B82"/>
    <text x="165" y="220" text-anchor="middle" fill="#FFFDF7" font-family="monospace" font-size="10">COBALT</text>
    
    <rect x="220" y="180" width="70" height="70" rx="4" fill="#D97706"/>
    <text x="255" y="220" text-anchor="middle" fill="#FFFDF7" font-family="monospace" font-size="10">COPPER</text>
    
    <rect x="310" y="180" width="130" height="70" rx="4" fill="#172A45"/>
    <text x="375" y="215" text-anchor="middle" fill="#64FFDA" font-family="monospace" font-size="10">5 VENTURES</text>
    <text x="375" y="235" text-anchor="middle" fill="#8892B0" font-family="sans-serif" font-size="10">UNIFIED BRAND</text>
  </g>

  <!-- Spec Tag -->
  <rect x="24" y="24" width="190" height="32" rx="3" fill="#64FFDA"/>
  <text x="36" y="44" fill="#0A192F" font-family="monospace" font-size="11" font-weight="bold">BLUEPRINT / JSN CREATIVE</text>
</svg>
