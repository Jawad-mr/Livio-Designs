<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <linearGradient id="violetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#0F0826"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3AFF"/>
      <stop offset="100%" stop-color="#EC008C"/>
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#4A3AFF" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="550" fill="url(#violetBg)"/>
  
  <!-- Neural Network Vector Graphics -->
  <g stroke="url(#purpleGlow)" stroke-width="1.5" opacity="0.6" fill="none">
    <path d="M100 275 L250 150 L400 275 L550 150 L700 275"/>
    <path d="M100 275 L250 400 L400 275 L550 400 L700 275"/>
    <path d="M250 150 L250 400"/>
    <path d="M550 150 L550 400"/>
  </g>

  <!-- Glowing Nodes -->
  <circle cx="250" cy="150" r="12" fill="#4A3AFF" filter="url(#aiGlow)"/>
  <circle cx="400" cy="275" r="16" fill="#EC008C" filter="url(#aiGlow)"/>
  <circle cx="550" cy="150" r="12" fill="#4A3AFF" filter="url(#aiGlow)"/>
  <circle cx="250" cy="400" r="10" fill="#4A3AFF"/>
  <circle cx="550" cy="400" r="10" fill="#EC008C"/>

  <!-- Mobile Glass Mockup -->
  <g transform="translate(480, 100)" filter="url(#aiGlow)">
    <rect x="0" y="0" width="220" height="380" rx="24" fill="#0A0A0A" stroke="#4A3AFF" stroke-width="2"/>
    <rect x="10" y="10" width="200" height="360" rx="18" fill="#150C30"/>
    <!-- Camera Notch -->
    <rect x="70" y="18" width="60" height="12" rx="6" fill="#0A0A0A"/>
    
    <text x="30" y="70" fill="#FFFDF7" font-family="sans-serif" font-size="16" font-weight="bold">Nexus AI</text>
    <text x="30" y="90" fill="#EC008C" font-family="monospace" font-size="9">AGENT 04 ONLINE</text>
    
    <rect x="25" y="110" width="150" height="70" rx="8" fill="#23134D"/>
    <circle cx="50" cy="145" r="14" fill="#4A3AFF"/>
    <rect x="75" y="132" width="80" height="8" rx="4" fill="#FFFDF7"/>
    <rect x="75" y="148" width="50" height="6" rx="3" fill="#EC008C"/>
    
    <rect x="25" y="195" width="150" height="70" rx="8" fill="#23134D"/>
    <circle cx="50" cy="230" r="14" fill="#EC008C"/>
    <rect x="75" y="217" width="70" height="8" rx="4" fill="#FFFDF7"/>
    <rect x="75" y="233" width="40" height="6" rx="3" fill="#4A3AFF"/>
  </g>

  <!-- Title Card -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" fill="#4A3AFF" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="3">AI AGENT PLATFORM</text>
    <text x="0" y="45" fill="#FFFDF7" font-family="serif" font-size="42" font-weight="bold">Nexus Agents.</text>
    <text x="0" y="80" fill="#E2E8F0" font-family="sans-serif" font-size="15" opacity="0.8">Kinetic logo, neural type system, and platform UI.</text>
  </g>

  <!-- Spec Tag -->
  <rect x="24" y="24" width="170" height="32" rx="3" fill="#4A3AFF"/>
  <text x="36" y="44" fill="#FFFDF7" font-family="monospace" font-size="11" font-weight="bold">LIVIO 099 — VIOLET</text>
</svg>
