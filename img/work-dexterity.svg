<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <linearGradient id="cyanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF"/>
      <stop offset="100%" stop-color="#005B82"/>
    </linearGradient>
    <filter id="bookShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0A0A0A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="550" fill="url(#cyanBg)"/>
  
  <!-- Open Book Spread Mockup -->
  <g filter="url(#bookShadow)" transform="translate(120, 100)">
    <!-- Left Page -->
    <path d="M0 20 C60 0, 200 0, 275 25 L275 355 C200 330, 60 330, 0 350 Z" fill="#FFFDF7"/>
    <!-- Right Page -->
    <path d="M550 20 C490 0, 350 0, 275 25 L275 355 C350 330, 490 330, 550 350 Z" fill="#F7F3E9"/>
    <!-- Book Spine -->
    <line x1="275" y1="25" x2="275" y2="355" stroke="#0A0A0A" stroke-width="2" opacity="0.3"/>
    
    <!-- Left Page Content (Typography Spread) -->
    <text x="40" y="70" fill="#0A0A0A" font-family="serif" font-size="22" font-weight="bold">Dexterity Learn.</text>
    <text x="40" y="95" fill="#00AEEF" font-family="monospace" font-size="10" font-weight="bold">CHAPTER 01 / PUBLISHING SPEC</text>
    
    <rect x="40" y="115" width="200" height="4" fill="#0A0A0A"/>
    <rect x="40" y="130" width="180" height="4" fill="#0A0A0A" opacity="0.4"/>
    <rect x="40" y="145" width="190" height="4" fill="#0A0A0A" opacity="0.4"/>
    <rect x="40" y="160" width="160" height="4" fill="#0A0A0A" opacity="0.4"/>
    
    <circle cx="140" cy="240" r="45" fill="#00AEEF" opacity="0.2"/>
    <text x="140" y="248" text-anchor="middle" fill="#00AEEF" font-family="monospace" font-size="28" font-weight="bold">Aa</text>

    <!-- Right Page Content (Layout Grid) -->
    <rect x="310" y="60" width="200" height="120" rx="4" fill="#0A0A0A"/>
    <text x="410" y="125" text-anchor="middle" fill="#FFFDF7" font-family="monospace" font-size="14">BOOK COVER</text>
    
    <rect x="310" y="200" width="95" height="100" fill="#00AEEF" opacity="0.2"/>
    <rect x="415" y="200" width="95" height="100" fill="#EC008C" opacity="0.2"/>
  </g>

  <!-- Spec Tag -->
  <rect x="24" y="24" width="180" height="32" rx="3" fill="#0A0A0A"/>
  <text x="36" y="44" fill="#FFFDF7" font-family="monospace" font-size="11" font-weight="bold">PROCESS CYAN / PRINT</text>
</svg>
