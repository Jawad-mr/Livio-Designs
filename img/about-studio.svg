<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="studioShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="550" fill="url(#studioBg)"/>
  
  <!-- Desk Grid Layout -->
  <rect x="60" y="50" width="680" height="450" rx="8" fill="#18181B" stroke="#27272A" stroke-width="2"/>
  
  <!-- Press Proof Sheet Mockup -->
  <g filter="url(#studioShadow)" transform="translate(100, 80)">
    <rect x="0" y="0" width="420" height="390" fill="#FFFDF7" stroke="#0A0A0A" stroke-width="1.5"/>
    
    <!-- Registration Target Marks -->
    <circle cx="30" cy="30" r="10" fill="none" stroke="#0A0A0A" stroke-width="1"/>
    <line x1="30" y1="15" x2="30" y2="45" stroke="#0A0A0A" stroke-width="1"/>
    <line x1="15" y1="30" x2="45" y2="30" stroke="#0A0A0A" stroke-width="1"/>

    <circle cx="390" cy="30" r="10" fill="none" stroke="#0A0A0A" stroke-width="1"/>
    <line x1="390" y1="15" x2="390" y2="45" stroke="#0A0A0A" stroke-width="1"/>
    <line x1="375" y1="30" x2="405" y2="30" stroke="#0A0A0A" stroke-width="1"/>

    <!-- Proof Content -->
    <text x="60" y="80" fill="#0A0A0A" font-family="serif" font-size="32" font-weight="bold">Livio Studio Proof</text>
    <text x="60" y="105" fill="#FF5A1F" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">REGISTER APPROVED — 2026</text>
    
    <rect x="60" y="130" width="300" height="150" fill="#0A0A0A"/>
    <text x="210" y="215" text-anchor="middle" fill="#FFFDF7" font-family="serif" font-size="20">DESIGN THAT HOLDS</text>
    
    <!-- CMYK Color Strips at Bottom of Proof -->
    <rect x="60" y="320" width="60" height="24" fill="#00AEEF"/>
    <rect x="120" y="320" width="60" height="24" fill="#EC008C"/>
    <rect x="180" y="320" width="60" height="24" fill="#FFF200"/>
    <rect x="240" y="320" width="60" height="24" fill="#0A0A0A"/>
    <rect x="300" y="320" width="60" height="24" fill="#FF5A1F"/>
  </g>
  
  <!-- Swatch Fan Deck Mockup -->
  <g filter="url(#studioShadow)" transform="translate(500, 160) rotate(15)">
    <rect x="0" y="0" width="80" height="260" rx="6" fill="#FF5A1F"/>
    <rect x="0" y="40" width="80" height="40" fill="#2D5C4B"/>
    <rect x="0" y="80" width="80" height="40" fill="#4A3AFF"/>
    <rect x="0" y="120" width="80" height="40" fill="#00AEEF"/>
    <rect x="0" y="160" width="80" height="40" fill="#EC008C"/>
    <circle cx="40" cy="235" r="12" fill="#FFFDF7"/>
    <text x="40" y="240" text-anchor="middle" fill="#0A0A0A" font-family="monospace" font-size="10" font-weight="bold">SWATCH</text>
  </g>

  <!-- Spec Tag -->
  <rect x="24" y="24" width="200" height="32" rx="3" fill="#FF5A1F"/>
  <text x="36" y="44" fill="#FFFDF7" font-family="monospace" font-size="11" font-weight="bold">STUDIO PRESS PROOF DESK</text>
</svg>
