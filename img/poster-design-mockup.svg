<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-poster-wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </linearGradient>
    <filter id="frame-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="12" dy="24" stdDeviation="24" flood-color="#18181B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Studio Gallery Concrete Wall -->
  <rect width="1200" height="900" fill="url(#bg-poster-wall)"/>

  <!-- Subtle Wall Texture / Light spot -->
  <radialGradient id="light-spot" cx="50%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#D4D4D8" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="900" fill="url(#light-spot)"/>

  <!-- Wooden Gallery Frame Outer -->
  <rect x="330" y="80" width="540" height="740" rx="4" fill="#18181B" filter="url(#frame-shadow)"/>
  <!-- Passepartout / Inner Mat Board -->
  <rect x="360" y="110" width="480" height="680" fill="#FAFAF9"/>

  <!-- Poster Print Area -->
  <g transform="translate(390, 140)">
    <!-- Poster Artwork Canvas -->
    <rect width="420" height="620" fill="#0F1015"/>

    <!-- Typographic Poster Content -->
    <text x="35" y="70" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#3B82F6" letter-spacing="3">EXHIBITION 2026</text>
    
    <text x="35" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-2">FORM &amp;</text>
    <text x="35" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-2">RESTRAIN.</text>
    
    <circle cx="300" cy="300" r="90" fill="#1E40AF"/>
    <rect x="180" y="270" width="160" height="160" fill="#D97706" opacity="0.85"/>

    <line x1="35" y1="480" x2="385" y2="480" stroke="#272A37" stroke-width="2"/>

    <text x="35" y="520" font-family="'Space Mono', monospace" font-size="11" fill="#9CA3AF">INTERNATIONAL TYPOGRAPHY SYMPOSIUM</text>
    <text x="35" y="540" font-family="'Space Mono', monospace" font-size="11" fill="#9CA3AF">CURATED BY LIVIO DESIGNS • JSN CREATIVE</text>
    <text x="35" y="570" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">OCTOBER 14 – NOVEMBER 02 • GALLERY 04</text>
  </g>
</svg>
