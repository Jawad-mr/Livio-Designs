<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1015"/>
      <stop offset="100%" stop-color="#181A20"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg-grad)"/>

  <!-- Grid overlay -->
  <g stroke="#272A35" stroke-width="1" opacity="0.3">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
  </g>

  <!-- Main Video Monitor Container -->
  <rect x="80" y="80" width="1040" height="740" rx="16" fill="#14161D" stroke="#2D313E" stroke-width="2" filter="url(#shadow)"/>

  <!-- Window Header Bar -->
  <rect x="80" y="80" width="1040" height="50" rx="16" fill="#1C1F2A"/>
  <circle cx="120" cy="105" r="7" fill="#EF4444"/>
  <circle cx="144" cy="105" r="7" fill="#F59E0B"/>
  <circle cx="168" cy="105" r="7" fill="#10B981"/>
  <text x="600" y="110" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#9CA3AF" text-anchor="middle">Premiere Pro — Livio_Commercial_Cut_v4K.mp4</text>

  <!-- Video Viewport Screen -->
  <rect x="110" y="150" width="680" height="420" rx="8" fill="#0A0B0E" stroke="#272A37"/>
  
  <!-- Video Scene Mockup Graphic -->
  <rect x="110" y="150" width="680" height="420" rx="8" fill="#111827"/>
  <circle cx="450" cy="360" r="140" fill="url(#accent-grad)" opacity="0.6"/>
  <polygon points="410,300 530,360 410,420" fill="#FFFFFF"/>
  <text x="140" y="190" font-family="monospace" font-size="14" fill="#3B82F6">PRORES 422 HQ • 3840x2160 • 60 FPS</text>
  <text x="140" y="215" font-family="monospace" font-size="12" fill="#9CA3AF">TC 01:14:22:08</text>

  <!-- Side Inspector Panel -->
  <rect x="810" y="150" width="280" height="420" rx="8" fill="#191C26" stroke="#272A37"/>
  <text x="830" y="185" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#E5E7EB">Color Wheels &amp; Scopes</text>
  
  <!-- Color Wheels Circles -->
  <circle cx="880" cy="260" r="35" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="880" cy="260" r="4" fill="#3B82F6"/>
  <text x="880" y="310" font-family="-apple-system, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">LIFT</text>

  <circle cx="1020" cy="260" r="35" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="1020" cy="260" r="4" fill="#F59E0B"/>
  <text x="1020" y="310" font-family="-apple-system, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">GAMMA</text>

  <circle cx="950" cy="390" r="35" fill="none" stroke="#10B981" stroke-width="2"/>
  <circle cx="950" cy="390" r="4" fill="#10B981"/>
  <text x="950" y="440" font-family="-apple-system, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">GAIN</text>

  <!-- Audio Meters -->
  <rect x="830" y="470" width="240" height="8" rx="4" fill="#2D313E"/>
  <rect x="830" y="470" width="180" rx="4" height="8" fill="#10B981"/>
  <rect x="830" y="490" width="240" height="8" rx="4" fill="#2D313E"/>
  <rect x="830" y="490" width="165" rx="4" height="8" fill="#10B981"/>

  <!-- Bottom Timeline Area -->
  <rect x="110" y="590" width="980" height="210" rx="8" fill="#161822" stroke="#272A37"/>
  
  <!-- Playhead Ruler Bar -->
  <rect x="110" y="590" width="980" height="30" fill="#1F2330"/>
  <line x1="520" y1="590" x2="520" y2="800" stroke="#EF4444" stroke-width="2"/>
  <polygon points="512,590 528,590 520,605" fill="#EF4444"/>

  <!-- Track 1: Video V2 -->
  <rect x="130" y="630" width="240" height="32" rx="4" fill="#1E40AF" opacity="0.9"/>
  <text x="145" y="651" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">V2: Titles_Overlay.mov</text>

  <rect x="380" y="630" width="310" height="32" rx="4" fill="#1E40AF" opacity="0.9"/>
  <text x="395" y="651" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">V2: LowerThird_Graphic.mov</text>

  <!-- Track 2: Video V1 (Main Footage) -->
  <rect x="130" y="670" width="320" height="36" rx="4" fill="#2563EB"/>
  <text x="145" y="693" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">V1: A001_C004_HeroShot.mov</text>

  <rect x="460" y="670" width="280" height="36" rx="4" fill="#2563EB"/>
  <text x="475" y="693" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">V1: A001_C009_CloseUp.mov</text>

  <rect x="750" y="670" width="320" height="36" rx="4" fill="#2563EB"/>
  <text x="765" y="693" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">V1: A002_C001_Outro.mov</text>

  <!-- Track 3: Audio A1 & A2 -->
  <rect x="130" y="714" width="610" height="30" rx="4" fill="#059669"/>
  <text x="145" y="734" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">A1: Main_Dialogue_Master.wav</text>

  <rect x="130" y="752" width="940" height="30" rx="4" fill="#D97706"/>
  <text x="145" y="772" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">A2: Soundtrack_Cinematic_Score.wav</text>
</svg>
