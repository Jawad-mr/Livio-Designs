<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#00AEEF" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="550" fill="url(#bg2)"/>
  
  <!-- Laptop Container -->
  <g filter="url(#glow)" transform="translate(100, 60)">
    <!-- Screen Frame -->
    <rect x="0" y="0" width="600" height="380" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <!-- Screen Inner -->
    <rect x="12" y="12" width="576" height="356" rx="8" fill="#090D16"/>
    <!-- Web Browser Bar -->
    <rect x="12" y="12" width="576" height="34" fill="#0F172A"/>
    <circle cx="32" cy="29" r="5" fill="#EF4444"/>
    <circle cx="48" cy="29" r="5" fill="#F59E0B"/>
    <circle cx="64" cy="29" r="5" fill="#10B981"/>
    <rect x="90" y="20" width="300" height="18" rx="9" fill="#1E293B"/>
    <text x="105" y="33" fill="#94A3B8" font-family="monospace" font-size="10">https://scholarsguide.com/discovery</text>
    
    <!-- Hero UI Mockup -->
    <text x="40" y="90" fill="#00AEEF" font-family="monospace" font-size="11" font-weight="600">SCHOLARSGUIDE PLATFORM</text>
    <text x="40" y="125" fill="#F8FAFC" font-family="sans-serif" font-size="24" font-weight="bold">Find Your Future Campus.</text>
    <text x="40" y="150" fill="#94A3B8" font-family="sans-serif" font-size="12">AI-driven college matching and interactive university discovery tool.</text>
    
    <!-- UI Cards -->
    <g transform="translate(40, 175)">
      <rect x="0" y="0" width="155" height="150" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="15" y="15" width="125" height="60" rx="4" fill="#00AEEF" opacity="0.2"/>
      <text x="25" y="52" fill="#00AEEF" font-family="sans-serif" font-size="16" font-weight="bold">MIT / ENG</text>
      <text x="15" y="98" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600">Engineering</text>
      <text x="15" y="118" fill="#94A3B8" font-family="sans-serif" font-size="10">98% Match Score</text>
    </g>
    
    <g transform="translate(210, 175)">
      <rect x="0" y="0" width="155" height="150" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="15" y="15" width="125" height="60" rx="4" fill="#EC008C" opacity="0.2"/>
      <text x="25" y="52" fill="#EC008C" font-family="sans-serif" font-size="16" font-weight="bold">STANFORD</text>
      <text x="15" y="98" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600">Computer Sci</text>
      <text x="15" y="118" fill="#94A3B8" font-family="sans-serif" font-size="10">96% Match Score</text>
    </g>
    
    <g transform="translate(380, 175)">
      <rect x="0" y="0" width="155" height="150" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="15" y="15" width="125" height="60" rx="4" fill="#FFF200" opacity="0.2"/>
      <text x="25" y="52" fill="#FFF200" font-family="sans-serif" font-size="16" font-weight="bold">HARVARD</text>
      <text x="15" y="98" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="600">Data Science</text>
      <text x="15" y="118" fill="#94A3B8" font-family="sans-serif" font-size="10">95% Match Score</text>
    </g>
  </g>
  
  <!-- Laptop Base -->
  <path d="M40 440h720l-40 25H80z" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="340" y="440" width="120" height="6" rx="3" fill="#334155"/>

  <!-- Spec Tag -->
  <rect x="24" y="24" width="165" height="32" rx="3" fill="#00AEEF"/>
  <text x="36" y="44" fill="#0A0A0A" font-family="monospace" font-size="11" font-weight="bold">CYAN / WEB PRODUCT</text>
</svg>
